[package]
name = "mtrak"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
license-file="LICENSE"
[[bin]]
name = "mtrak"
path = "src/main.rs"
[dependencies]
clap_derive = { version = "4.0.0-rc.1" }
ratatui = "0.29.0"
serde = { version = "1.0.219", features = ["derive", "rc"] }
clap = "4.5.45"
dirs = "6.0.0"
figlet-rs = "1.0.0"
midir = "0.11.0"
midi = "0.1.0"
chrono = "0.4.45"
num = "0.4.3"
ureq = { version = "3.4.2", default-features = false, features = ["native-tls"] }
serde_json = "1.0.143"
zip = { version = "7.2.0", default-features = false, features = ["deflate-flate2"] }
rand = "0.10.3"
rmp-serde = "1.3.1"
rmpv = "1.3.1"
serde_bytes = "0.11.19"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false

[lints.clippy]
needless_return = "allow"
module_inception = "allow"
