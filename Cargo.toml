[package]
name = "m_trak"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
[[bin]]
name = "mtrak"
path = "src/main.rs"
[dependencies]
clap_derive = { version = "4.0.0-rc.1" }
bincode = { version = "2.0.1", features = ["serde"] }
ratatui = "0.29.0"
serde = { version = "1.0.219", features = ["derive"] }
clap = "4.5.45"
dirs = "6.0.0"
figlet-rs = "1.0.0"
midir = "0.11.0"
midi = "0.1.0"
chrono = "0.4.45"
num = "0.4.3"
self_update = { version = "0.44.0", default-features = false, features = ["reqwest", "rustls", "archive-zip", "compression-zip-deflate"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false

[lints.clippy]
needless_return = "allow"
module_inception = "allow"
